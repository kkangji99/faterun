<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>운명 피하기</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&display=swap" />
  <style>
    :root {
      color-scheme: light;
      --bg: #fff4e0; --card: #fffaf0; --ink: #221a2e; --sub: #7a6e8a;
      --red: #e8453c; --green: #2f8a45; --purple: #6b4bd6; --line: #221a2e;
      --display: "Jua", "Noto Sans KR", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font: 16px/1.5 "Noto Sans KR", sans-serif;
      display: grid; place-items: center; padding-inline: 16px;
      word-break: keep-all; overflow-wrap: anywhere;
      -webkit-tap-highlight-color: transparent;
    }
    body.playing { padding: 0; overflow: hidden; height: 100vh; height: 100dvh; }
    #game canvas { display: block; }
    .screen { width: min(460px, 100%); padding-block: 24px; display: grid; gap: 16px; }
    h1 { margin: 0; font: 56px/1 var(--display); color: var(--red); text-align: center; }
    .tag { margin: 0; text-align: center; color: var(--sub); font-family: var(--display); font-size: 20px; }
    .card { background: var(--card); border: 3px solid var(--line); border-radius: 24px; padding: 20px; display: grid; gap: 12px; box-shadow: 0 6px 0 var(--line); }
    label { font-family: var(--display); font-size: 18px; }
    .card > * { min-width: 0; }
    /* iOS Safari: 날짜/시간 칸의 고유 최소 폭 때문에 카드 밖으로 삐져나가는 것 방지 */
    input[type="date"], input[type="time"] {
      display: block; width: 100%; max-width: 100%; min-width: 0; min-height: 50px;
      -webkit-appearance: none; appearance: none;
      padding: 12px; border: 2px solid var(--line); border-radius: 14px;
      font: inherit; font-size: 16px; color: var(--ink); background: #fff; text-align: left;
    }
    input::-webkit-date-and-time-value { text-align: left; }
    input:disabled { opacity: 0.45; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .check { font-family: inherit; font-size: 14px; color: var(--sub); display: flex; gap: 6px; align-items: center; }
    button.big {
      width: 100%; padding: 16px; border: 3px solid var(--line); border-radius: 18px;
      background: var(--red); color: #fffaf0; font: 26px var(--display); cursor: pointer; box-shadow: 0 5px 0 var(--line);
    }
    button.big:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--line); }
    button:focus-visible, input:focus-visible { outline: 3px solid var(--purple); outline-offset: 2px; }
    .lineup { display: flex; justify-content: center; gap: 4px; }
    .lineup canvas { width: 56px; height: 62px; }
    .hero { display: grid; justify-items: center; text-align: center; gap: 4px; }
    .hero canvas { width: 136px; height: 150px; }
    .hero .name { font: 34px/1.1 var(--display); }
    .hero .summary { font-family: var(--display); color: var(--green); font-size: 19px; }
    .trio { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .trio > div { border: 2px solid var(--line); border-radius: 16px; padding: 8px 4px; display: grid; justify-items: center; font-family: var(--display); }
    .trio small { color: var(--sub); font-size: 14px; }
    .trio canvas { width: 48px; height: 48px; }
    .foe { background: #ffe1dc; } .friend { background: #e1f5e4; } .luck { background: #fff3c4; }
    .skills { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { background: #efe6ff; color: #4b2fb0; border: 2px solid var(--purple); border-radius: 999px; padding: 4px 12px; font-family: var(--display); }
    .desc { color: var(--sub); font-size: 14px; }
    .fortune h2 { margin: 0; font: 24px var(--display); }
    .fortune p { margin: 0; }
    .how { display: grid; gap: 6px; font-size: 15px; }
    .rps { display: grid; gap: 4px; font-family: var(--display); font-size: 17px; }
    .sub-term { color: var(--sub); font-size: 12px; }
    /* 게임: 화면 전체를 쓰고, 탭이 확대·선택으로 새지 않게 */
    #game {
      width: 100vw; height: 100vh; height: 100dvh;
      overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
      padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
    }
    #result { position: fixed; inset: 0; background: rgba(34, 26, 46, 0.6); display: grid; place-items: center; padding: 8px; }
    /* 9:16 비율을 지키면서 화면 안에 맞춘다 (늘어나지 않게 폭으로만 크기 결정) */
    #result canvas {
      width: min(100%, calc((100vh - 16px) * 9 / 16)); width: min(100%, calc((100dvh - 16px) * 9 / 16));
      height: auto; aspect-ratio: 9 / 16; border-radius: 20px;
    }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <section id="intro" class="screen">
    <h1>운명 피하기</h1>
    <p class="tag">생일만 넣으면, 내 팔자대로 달린다</p>
    <div class="lineup" id="lineup"></div>
    <form id="birth-form" class="card">
      <label for="birth-date">생년월일 (양력)</label>
      <input id="birth-date" type="date" name="date" required value="1995-06-15" />
      <label for="birth-time">태어난 시각</label>
      <input id="birth-time" type="time" name="time" value="08:30" />
      <label class="check"><input id="no-time" type="checkbox" /> 시간은 몰라요</label>
      <button class="big" type="submit">내 캐릭터 뽑기</button>
    </form>
  </section>

  <section id="reveal" class="screen" hidden>
    <div class="card hero">
      <canvas id="hero-canvas" width="80" height="88"></canvas>
      <div class="name" id="char-name"></div>
      <div class="desc" id="char-tagline"></div>
      <div class="summary" id="char-summary"></div>
    </div>
    <div class="trio">
      <div class="foe"><small>피해요! 천적</small><canvas id="foe-canvas" width="64" height="64"></canvas><span id="foe-name"></span></div>
      <div class="friend"><small>먹어요! 내 색깔</small><canvas id="friend-canvas" width="64" height="64"></canvas><span id="friend-name"></span></div>
      <div class="luck"><small>럭키템</small><canvas id="luck-canvas" width="52" height="52"></canvas><span id="luck-name"></span></div>
    </div>
    <div class="card">
      <strong>팔자 스킬</strong>
      <div id="skills" class="how"></div>
    </div>
    <div class="card fortune">
      <h2 id="fortune-title"></h2>
      <p id="fortune-headline"></p>
      <p class="desc" id="fortune-desc"></p>
    </div>
    <div class="card how">
      <strong>하는 법</strong>
      <div>👆 <b>손가락으로 좌우로 움직여서</b> 하늘에서 떨어지는 운명을 피해요 <span class="desc">(PC: ← →)</span></div>
      <div>✨ <b id="how-friend"></b> 친구라 먹으면 점수! 나머지는 전부 피하기</div>
      <div>😱 <b>아슬아슬하게</b> 피하면 보너스 + 럭키 게이지 → 가득 차면 럭키타임</div>
      <div class="rps" id="moves"></div>
    </div>
    <button class="big" id="start">달리기!</button>
  </section>

  <div id="game" hidden></div>
  <div id="result" hidden><canvas width="1080" height="1920" aria-label="결과 카드"></canvas></div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
